# =============================================================================
# VAYUVERSE AI — 100% Free-Tier Render Backend Blueprint (render.yaml)
# Frontend: Vercel (Hobby Free) | Backend: Render (Free) | DB: Supabase (Free)
# =============================================================================

services:
  - type: web
    name: vayuverse-ai-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # Paste Supabase Free-Tier Transaction Pooler URI (:6543, IPv4-compatible)
      - key: AUTH_SECRET
        sync: false # MUST match AUTH_SECRET in Vercel exactly (32+ char random string)
      - key: INTERNAL_API_SECRET
        sync: false # MUST match INTERNAL_API_SECRET in Vercel exactly (32+ char random string)
      - key: FRONTEND_URL
        sync: false # Your Vercel URL, e.g. https://vayuverse-ai.vercel.app
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: ENABLE_DEMO_MODE
        value: "false"
      - key: GEMINI_API_KEY
        sync: false # Optional (100% Free at https://aistudio.google.com/apikey) for Gemini AI chat
      - key: WAQI_API_TOKEN
        sync: false # Optional (100% Free at https://aqicn.org/data-platform/token/) for station overlay
